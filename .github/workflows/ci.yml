name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate diagram specs
        run: node tools/render-diagrams.mjs --check
      - name: Check links and rendered diagrams
        run: node tools/check-docs.mjs
